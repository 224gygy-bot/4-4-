<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>꼬마 탐정 스도쿠</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8a13c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="꼬마 탐정">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff8e7; --ink:#4a3b2a; --accent:#e8a13c; --gold:#f5c542;
  --good:#4caf6d; --bad:#ef7d7d; --card:#fffdf5; --blue:#2b7cd3;
  --line:#d8c3a0; --thick:#6b4f2a;
  color-scheme:light;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Gowun Dodum',sans-serif; color:var(--ink);
  background:#7fb2d9;
  background-image:repeating-linear-gradient(45deg,#7fb2d9 0 20px,#86badf 20px 40px);
  min-height:100vh; display:flex; justify-content:center; padding:10px 8px;
}
#app{
  width:100%; max-width:440px; align-self:flex-start; background:var(--paper);
  background-image:radial-gradient(#00000008 1px,transparent 1px); background-size:8px 8px;
  border-radius:18px; border:3px solid #b98a4e; box-shadow:0 8px 30px #0004; padding:12px;
}
h1,h2,h3,.jua{font-family:'Jua',sans-serif; font-weight:normal;}
h1{font-size:1.6rem; margin:6px 0;}
h2{font-size:1.35rem; margin:4px 0;}
h3{font-size:1.1rem; margin:4px 0 8px;}
h2 small,h3 small{font-size:.8rem; opacity:.75; font-family:'Gowun Dodum',sans-serif;}
p{line-height:1.55;}
button{
  font-family:inherit; min-height:48px; min-width:48px; cursor:pointer;
  border-radius:12px; border:2px solid #b98a4e; background:#ffe9bd; color:var(--ink);
  font-size:1.05rem; padding:8px 14px; transition:transform .08s; -webkit-tap-highlight-color:transparent;
}
button:active{transform:scale(.96);}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px;}
.center{text-align:center;}
.big-btn{font-size:1.15rem; padding:12px 22px; background:var(--accent); color:#fff; border-color:#a86f1e; font-family:'Jua',sans-serif;}
.ghost{background:#e5e0d4; border-color:#b0a890;}
.toolbar{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0;}

/* 상단 바 */
#topbar{position:sticky; top:0; z-index:10; background:var(--paper); border:2px dashed #b98a4e;
  border-radius:12px; padding:6px 8px; margin-bottom:10px; display:none; align-items:center; gap:6px; flex-wrap:wrap;}
#det-name{font-size:1.15rem;}
.pill{font-size:.82rem; background:#fff; border:1px solid #b98a4e; border-radius:20px; padding:2px 9px;}
#topbar .sp{flex:1;}
#home-btn{min-height:40px; min-width:44px; padding:2px 10px; font-size:1.1rem;}

/* 메뉴 */
.menu-btn{display:flex; align-items:center; gap:12px; width:100%; margin:8px 0; text-align:left; background:#fff; padding:10px 14px;}
.menu-btn .ic{font-size:1.9rem; flex:none;}
.menu-btn b{font-size:1.15rem;}
.menu-btn small{display:block; font-size:.85rem; opacity:.8;}
.menu-btn.hl{background:#dff0ff; border-color:var(--blue);}

/* 캐릭터 말풍선 */
.char{width:76px; height:76px; flex:none;}
.speech{display:flex; gap:8px; align-items:flex-end; margin:10px 0;}
.bubble{background:#fff; border:2px solid #b98a4e; border-radius:14px; padding:10px 12px; line-height:1.5; flex:1;}

/* 사건 이야기 진행 */
.gold-strip{display:flex; gap:6px; justify-content:center; margin:6px 0;}
.gold-slot{width:42px; height:42px; border-radius:8px; border:2px solid #c9a227; background:#fff;
  display:flex; align-items:center; justify-content:center; font-family:'Jua'; font-size:1.4rem; color:#c9a227;}
.gold-slot.filled{background:linear-gradient(145deg,#ffe27a,#f5c542); color:#5b4300; box-shadow:0 0 8px #f5c542;}
.sprog{display:flex; gap:3px; margin-bottom:4px;}
.sprog .seg{flex:1; height:9px; border-radius:5px; background:#e5d9c0; border:1px solid #b98a4e;}
.sprog .seg.done{background:var(--good);}
.choice{display:block; width:100%; margin:8px 0; font-size:1.15rem; background:#fff;}

/* 스도쿠 판 */
.board{display:grid; margin:10px auto; width:100%; touch-action:manipulation;}
.cell{aspect-ratio:1/1; background:var(--card); display:flex; align-items:center; justify-content:center;
  font-family:'Jua',sans-serif; cursor:pointer; position:relative; user-select:none; -webkit-user-select:none; color:var(--blue);}
.b4 .cell{font-size:1.8rem;} .b6 .cell{font-size:1.4rem;} .b9 .cell{font-size:1.2rem;}
.cell.given{background:#f3e5c8; color:var(--ink);}
.cell.related{background:#e4eefc;}
.cell.given.related{background:#dbe3ef;}
.cell.same-num{background:#bcd6fb;}
.cell.marked{background:#ffe3ee;}
.cell.correct{background:#d8f3dc;}
.cell.selected{background:#ffe08a; box-shadow:inset 0 0 0 3px var(--accent);}
.cell.wrong{background:#ffb8b8 !important;}
.cell .mk{position:absolute; top:1px; left:4px; font-size:.75rem; color:#c2185b;}
.notes{display:grid; width:100%; height:100%; padding:1px; color:#5f7896; font-family:'Gowun Dodum',sans-serif;}
.notes span{display:flex; align-items:center; justify-content:center; line-height:1;}
.b4 .notes span{font-size:.8rem;} .b6 .notes span{font-size:.62rem;} .b9 .notes span{font-size:.55rem;}
@keyframes hintFlash{50%{background:#ffe27a; box-shadow:0 0 14px #f5c542;}}
.cell.hintflash{animation:hintFlash .8s ease 3;}

/* 숫자 패드 */
.numpad{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:10px auto; max-width:380px;}
.numpad button{flex:1 1 0; max-width:66px; height:56px; padding:0; font-family:'Jua'; font-size:1.6rem; background:#fff;}
.numpad.n9 button{flex:0 0 calc(20% - 5px); max-width:none; height:52px; font-size:1.45rem;}
.numpad button.full{opacity:.3;}
.numpad.note-on button{background:#eef6ff; border-color:var(--blue); color:var(--blue); font-size:1.2rem;}
#note-btn.on{background:var(--blue); color:#fff; border-color:#1d5ea3;}
.play-head{display:flex; align-items:baseline; justify-content:space-between; gap:6px; flex-wrap:wrap;}
.stat{font-size:.85rem;}

/* 피드백/카드 */
.feedback{border-radius:12px; padding:10px 12px; margin:10px 0; line-height:1.5; display:none;}
.feedback.ok{display:block; background:#d8f3dc; border:2px solid var(--good);}
.feedback.no{display:block; background:#ffe3e3; border:2px solid var(--bad);}
.feedback.hint{display:block; background:#dff0ff; border:2px solid var(--blue);}
.clue-card{background:linear-gradient(145deg,#fff,#ffeec7); border:2px solid #c9a227; border-radius:12px;
  padding:8px 12px; margin:6px 0; box-shadow:2px 2px 6px #0002; line-height:1.6;}
.clue-card.golden{background:linear-gradient(145deg,#ffe27a,#f5c542); border:3px solid #a67c00;}
.rec{display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dotted #d8c3a0;}
.stamp{display:inline-block; border:4px solid #d33; color:#d33; border-radius:50%; padding:6px 14px;
  font-family:'Jua'; transform:rotate(-12deg); font-size:1.2rem; animation:stampIn .4s ease;}
@keyframes stampIn{0%{transform:scale(2.5) rotate(-12deg); opacity:0;}100%{transform:scale(1) rotate(-12deg); opacity:1;}}
@keyframes pop{0%{transform:scale(.3);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
.pop{animation:pop .45s ease;}
.cert{border:4px double #a86f1e; padding:16px; background:#fffbe8; text-align:center; margin:10px 0;}
#password-show{font-family:'Jua'; font-size:3rem; letter-spacing:12px; color:#a86f1e; text-align:center;}
input[type=text]{min-height:48px; font-size:1.1rem; padding:8px; border-radius:10px; border:2px solid #b98a4e; width:100%; font-family:inherit; background:#fff;}

/* 레벨 지도 */
.zone{border:2px dashed #b98a4e; border-radius:14px; padding:10px; margin:10px 0; background:#fffdf5;}
.lv-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.lv-card{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:84px;
  border-radius:14px; border:3px solid #b98a4e; background:#fff; font-family:'Jua'; padding:4px; position:relative; font-size:1rem;}
.lv-card.open{background:#ffe9bd;}
.lv-card.done{background:#d8f3dc; border-color:var(--good);}
.lv-card.locked{background:#e5e0d4; color:#8a8378; border-color:#b0a890;}
.lv-card .stars{color:#e8a13c; font-size:.8rem; min-height:1em;}
.lv-card .resume{position:absolute; top:-9px; right:-4px; background:var(--blue); color:#fff; border-radius:10px; font-size:.65rem; padding:1px 6px;}
@keyframes pulse{50%{box-shadow:0 0 0 5px #e8a13c66;}}
.lv-card.next{animation:pulse 1.4s ease infinite;}
/* 프리스타일 선택 */
.opt-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:8px;}
.opt{display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; font-family:'Jua',sans-serif; font-size:1.15rem; padding:8px 4px;}
.opt small{font-family:'Gowun Dodum',sans-serif; font-size:.72rem; opacity:.8;}
.opt.on{background:var(--accent); color:#fff; border-color:#a86f1e;}
.opt.on small{opacity:1;}
.loading-box{text-align:center; padding:40px 10px;}
@keyframes spinMag{to{transform:rotate(360deg);}}
.loading-box .mag{display:inline-block; font-size:3rem; animation:spinMag 1.2s linear infinite;}

details{margin-top:16px; border-top:2px dashed #b98a4e; padding-top:8px; font-size:.9rem;}
summary{cursor:pointer; min-height:48px; display:flex; align-items:center;}
#parent-content p{margin:6px 0;}
table{border-collapse:collapse; width:100%; font-size:.8rem; margin:6px 0;}
td,th{border:1px solid #b98a4e; padding:3px 5px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="det-name" class="jua"></span>
    <span id="badge" class="pill"></span>
    <span id="starcount" class="pill"></span>
    <span class="sp"></span>
    <button id="home-btn" aria-label="처음 화면">🏠</button>
  </div>
  <div id="screen"></div>
  <details id="parent-guide">
    <summary class="jua">👨‍👩‍👧 부모님 안내 (눌러서 열기)</summary>
    <div id="parent-content"></div>
  </details>
</div>

<script>

const screen=$("#screen");
const STORE_KEY="kkomaSudoku_v2", CUR_KEY="kkomaSudoku_v2_current";

/* ---------------- 사건 이야기 데이터 ---------------- */

const GOLDEN=[3,1,4,2];

const ZONES=[[1,4,"🏘️ 동네 사건","4×4 · 숫자 1~4"],[5,8,"🏙️ 도시 사건","6×6 · 숫자 1~6"],
             [9,12,"🌏 나라 사건","9×9 · 숫자 1~9"],[13,15,"👑 전설 사건","9×9 · 최고 난이도"]];
const RANKS=[[0,"🐣","아기 탐정"],[2,"🔍","견습 탐정"],[4,"⭐","꼬마 탐정"],[8,"🏙️","도시 탐정"],[12,"🎩","명탐정"],[15,"👑","전설의 탐정"]];
const zoneIcon=lv=>lv<=4?"🏘️":lv<=8?"🏙️":lv<=12?"🌏":"👑";

/* ---------------- 프리스타일 데이터 ---------------- */
const SIZES={4:{bw:2,bh:2},6:{bw:3,bh:2},9:{bw:3,bh:3}};
const DIFFS=[["easy","🌱 쉬움"],["normal","🌿 보통"],["hard","🌳 어려움"],["expert","🔥 최고"]];
const FREE_BLANKS={4:{easy:5,normal:8,hard:10,expert:12},6:{easy:10,normal:16,hard:21,expert:25},9:{easy:28,normal:40,hard:50,expert:58}};
const diffName=d=>(DIFFS.find(x=>x[0]===d)||[d,d])[1];

/* ---------------- 캐릭터 ---------------- */
const CHIEF_SVG=`<svg class="char" viewBox="0 0 100 100" aria-label="대장 탐정">
<ellipse cx="50" cy="88" rx="26" ry="10" fill="#8a6d4b"/><circle cx="50" cy="48" r="26" fill="#ffdfba"/>
<path d="M22 40 Q50 18 78 40 L78 34 Q50 8 22 34 Z" fill="#6b4f2a"/><rect x="18" y="36" width="64" height="8" rx="4" fill="#6b4f2a"/>
<circle cx="41" cy="48" r="3.5" fill="#333"/><circle cx="59" cy="48" r="3.5" fill="#333"/>
<path d="M42 60 Q50 66 58 60" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<rect x="34" y="68" width="32" height="22" rx="8" fill="#4a6b8a"/></svg>`;
const RACCOON_SVG=`<svg class="char" viewBox="0 0 100 100" aria-label="뒤죽박죽 너구리">
<circle cx="32" cy="26" r="10" fill="#8a7a6a"/><circle cx="68" cy="26" r="10" fill="#8a7a6a"/>
<circle cx="32" cy="26" r="5" fill="#ffb0b0"/><circle cx="68" cy="26" r="5" fill="#ffb0b0"/>
<circle cx="50" cy="52" r="30" fill="#a59484"/>
<ellipse cx="38" cy="50" rx="11" ry="9" fill="#4a4038"/><ellipse cx="62" cy="50" rx="11" ry="9" fill="#4a4038"/>
<circle cx="38" cy="50" r="3" fill="#fff"/><circle cx="62" cy="50" r="3" fill="#fff"/>
<ellipse cx="50" cy="66" rx="9" ry="7" fill="#f5e6d8"/><circle cx="50" cy="62" r="3.5" fill="#333"/>
<path d="M44 70 Q50 75 56 70" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;

/* ---------------- 저장 (탐정 프로필별) ---------------- */
let profiles={}, cur="", P=null;
const freshProfile=()=>({ story:{mission:0,gold:[null,null,null,null],clues:[],finished:false},
                         lv:{cleared:[],stars:{},current:null},
                         free:{current:null,done:{},last:{n:4,diff:"easy"}} });
function load(){
  try{ const s=localStorage.getItem(STORE_KEY); if(s){ const p=JSON.parse(s); if(p&&typeof p==="object"&&!Array.isArray(p)) profiles=p; } }catch(e){}
  try{ cur=localStorage.getItem(CUR_KEY)||""; }catch(e){}
}
function persist(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(profiles)); localStorage.setItem(CUR_KEY,cur); }catch(e){}
}
function useProfile(name){
  cur=name;
  const f=freshProfile(), p=profiles[name]||{};
  P={ story:Object.assign(f.story,p.story||{}), lv:Object.assign(f.lv,p.lv||{}), free:Object.assign(f.free,p.free||{}) };
  profiles[name]=P; persist();
}
function uniqueName(nm){ if(!profiles[nm]) return nm; let i=2; while(profiles[nm+" ("+i+")"]) i++; return nm+" ("+i+")"; }
function rankOf(cnt){ let r=RANKS[0]; for(const x of RANKS) if(cnt>=x[0]) r=x; return r; }
function starsOf(p){ return Object.values((p&&p.lv&&p.lv.stars)||{}).reduce((a,b)=>a+(b||0),0); }
function isOpen(l){ return l===1||P.lv.cleared.includes(l-1); }
function nextLevel(){ for(let l=1;l<=LEVELS.length;l++) if(!P.lv.cleared.includes(l)) return l; return LEVELS.length; }

/* ---------------- 공통 UI ---------------- */
function escapeHTML(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function onTap(el,fn){ el.onclick=fn; el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fn(); } }; }
function chiefSays(t){ return `<div class="speech">${CHIEF_SVG}<div class="bubble"><b>대장 탐정:</b> ${t}</div></div>`; }
function raccoonSays(t){ return `<div class="speech">${RACCOON_SVG}<div class="bubble"><b>뒤죽박죽 너구리:</b> ${t}</div></div>`; }
function fb(kind,msg){ const f=$("#feedback"); if(!f) return; f.className="feedback "+kind; f.textContent=msg; }
function renderTop(){
  const tb=$("#topbar");
  if(!cur||!P){ tb.style.display="none"; renderParent(); return; }
  tb.style.display="flex";
  const rk=rankOf(P.lv.cleared.length);
  $("#det-name").textContent=cur+" 탐정";
  $("#badge").textContent=rk[1]+" "+rk[2];
  $("#starcount").textContent="⭐"+starsOf(P)+" · 레벨 "+P.lv.cleared.length+"/"+LEVELS.length;
  renderParent();
}
$("#home-btn").onclick=()=>{ if(cur&&P) home(); else profileScreen(); };

/* 판 그리기 (4×4, 6×6, 9×9 및 이야기용 작은 판 공용) */
function buildBoard(grid,{bw=2,bh=2,marks=null}={}){
  const rows=grid.length, cols=grid[0].length, big=Math.max(rows,cols);
  const b=document.createElement("div");
  b.className="board b"+(big<=4?4:big<=6?6:9);
  b.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  b.style.maxWidth=cols===1?"76px":cols<=4?"280px":cols<=6?"340px":"420px";
  const thick="3px solid var(--thick)", thin="1px solid var(--line)";
  grid.forEach((row,r)=>row.forEach((v,c)=>{
    const d=document.createElement("div");
    d.className="cell"; d.dataset.r=r; d.dataset.c=c; d.tabIndex=0;
    d.setAttribute("role","button"); d.setAttribute("aria-label",`${r+1}번째 줄 ${c+1}번째 칸`);
    d.style.borderLeft=c%bw===0?thick:thin; d.style.borderTop=r%bh===0?thick:thin;
    d.style.borderRight=c===cols-1?thick:thin; d.style.borderBottom=r===rows-1?thick:thin;
    const mk=marks&&marks.find(m=>m[0]===r&&m[1]===c);
    if(mk){ d.dataset.mk=mk[2]; d.classList.add("marked"); }
    setCellNum(d,v);
    b.appendChild(d);
  }));
  return b;
}
function setCellNum(d,v){ d.innerHTML=(d.dataset.mk?`<span class="mk">${d.dataset.mk}</span>`:"")+(v?v:""); }
const cellAt=(b,r,c)=>b.querySelector(`[data-r="${r}"][data-c="${c}"]`);

/* ---------------- 탐정 고르기 ---------------- */
let pendingDelete=null;
function profileScreen(){
  cur=""; P=null; G=null; renderTop();
  const names=Object.keys(profiles);
  let html=`<h1 class="center">🔎 꼬마 탐정 스도쿠</h1>
    <p class="center jua" style="font-size:1.2rem; margin:8px 0">누가 탐정 놀이를 할까?</p>`;
  if(names.length===0) html+=`<div class="clue-card center">아직 탐정이 없어!<br>아래 버튼을 눌러 새 탐정을 만들어 보자!</div>`;
  html+=names.map(nm=>{
    const p=profiles[nm]||{}, cnt=((p.lv&&p.lv.cleared)||[]).length, rk=rankOf(cnt), st=p.story||{};
    const del=pendingDelete===nm
      ? `<button data-del="${escapeHTML(nm)}" style="background:#ffdada;border-color:#d33;font-size:.9rem">정말 지울까?<br>한 번 더!</button>`
      : `<button data-del="${escapeHTML(nm)}" aria-label="${escapeHTML(nm)} 탐정 삭제">🗑️</button>`;
    return `<div class="clue-card"><div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:2.2rem" aria-hidden="true">${rk[1]}</span>
        <div style="flex:1"><b class="jua" style="font-size:1.25rem">${escapeHTML(nm)} 탐정</b><br>
        <span style="font-size:.9rem">${rk[2]} · 레벨 ${cnt}/${LEVELS.length} · ⭐${starsOf(p)} · 이야기 ${st.finished?"완료":(st.mission||0)+"/10"}</span></div>
        ${del}</div>
      <button class="big-btn" data-cont="${escapeHTML(nm)}" style="width:100%;margin-top:8px">▶ 이 탐정으로 하기</button></div>`;
  }).join("");
  html+=`<div class="center" style="margin-top:14px"><button class="big-btn" id="new-btn" style="background:var(--good);border-color:#2e7d43">➕ 새 탐정 만들기</button></div>`;
  screen.innerHTML=html;
  $("#new-btn").onclick=newProfileScreen;
  screen.querySelectorAll("[data-cont]").forEach(b=>b.onclick=()=>{ pendingDelete=null; useProfile(b.dataset.cont); home(); });
  screen.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const nm=b.dataset.del;
    if(pendingDelete===nm){ delete profiles[nm]; pendingDelete=null; persist(); }
    else pendingDelete=nm;
    profileScreen();
  });
}
function newProfileScreen(){
  screen.innerHTML=`<h1 class="center">🔎 사라진 숫자 보석 사건</h1>
    <div class="cert" style="text-align:left">
      <p class="jua" style="font-size:1.2rem">📜 사건 의뢰서</p><br>
      <p>꼬마 탐정에게!</p><br>
      <p>보석 상자에 있던 <b>숫자 보석</b>들이 사라졌어! 범인은 숫자를 몰래 바꾸는 <b>뒤죽박죽 너구리</b>야.</p><br>
      <p>규칙을 배우고, 동네 → 도시 → 나라 사건을 차례로 해결해서 <b>9×9 명탐정</b>이 되어 줘!</p><br>
      <p style="text-align:right">- 대장 탐정 🕵️</p>
    </div>
    <label for="name-input" class="jua">탐정 이름을 적어 줘!</label>
    <input type="text" id="name-input" maxlength="10" placeholder="예: 하은">
    <div class="center" style="margin-top:12px"><button class="big-btn" id="start-btn">탐정 등록!</button></div>
    <div class="center" style="margin-top:10px"><button class="ghost" id="back-btn">← 탐정 목록으로</button></div>`;
  const inp=$("#name-input");
  $("#start-btn").onclick=()=>{ const nm=uniqueName(inp.value.trim()||"꼬마"); profiles[nm]=freshProfile(); useProfile(nm); home(); };
  inp.onkeydown=e=>{ if(e.key==="Enter") $("#start-btn").click(); };
  $("#back-btn").onclick=profileScreen;
  inp.focus();
}

/* ---------------- 처음 화면 ---------------- */
function home(){
  G=null; renderTop();
  const S=P.story, L=P.lv, cnt=L.cleared.length, nx=nextLevel();
  const tip=!S.finished&&cnt===0 ? "처음이라면 📜 사건 이야기로 규칙부터 배워 보자!"
    : cnt>=LEVELS.length ? "모든 사건을 해결했어! 이제 모든 레벨 별 3개에 도전해 볼까?"
    : `다음 목표는 레벨 ${nx} (${LEVELS[nx-1].n}×${LEVELS[nx-1].n})! 9×9 명탐정까지 가 보자!`;
  const c=L.current, fc=P.free.current;
  screen.innerHTML=`<h1 class="center">🔎 꼬마 탐정 스도쿠</h1>
    ${chiefSays(escapeHTML(cur)+" 탐정, 어서 와! "+tip)}
    ${c?`<button class="menu-btn hl" id="resume-btn"><span class="ic">▶️</span><span><b class="jua">하던 사건 이어하기</b><small>레벨 ${c.lv} · ${LEVELS[c.lv-1].n}×${LEVELS[c.lv-1].n}</small></span></button>`:""}
    ${fc?`<button class="menu-btn hl" id="fresume-btn"><span class="ic">▶️</span><span><b class="jua">하던 프리스타일 이어하기</b><small>${fc.n}×${fc.n} · ${diffName(fc.diff)}</small></span></button>`:""}
    <button class="menu-btn" id="story-btn"><span class="ic">📜</span><span><b class="jua">사건 이야기 (규칙 배우기)</b><small>${S.finished?"해결 완료! 🎉":S.mission+"/10장"}</small></span></button>
    <button class="menu-btn" id="map-btn"><span class="ic">🗺️</span><span><b class="jua">레벨 지도</b><small>4×4 → 6×6 → 9×9 · ${cnt}/${LEVELS.length} 해결</small></span></button>
    <button class="menu-btn" id="free-btn"><span class="ic">🎲</span><span><b class="jua">프리스타일</b><small>4×4 · 6×6 · 9×9 + 난이도를 골라서 마음껏</small></span></button>
    <button class="menu-btn" id="nb-btn"><span class="ic">📓</span><span><b class="jua">탐정 수첩</b><small>규칙 · 요령 · 기록</small></span></button>
    <button class="menu-btn" id="sw-btn"><span class="ic">🔄</span><span><b class="jua">탐정 바꾸기</b></span></button>`;
  if(c) $("#resume-btn").onclick=()=>playScreen("lv");
  if(fc) $("#fresume-btn").onclick=()=>playScreen("free");
  $("#free-btn").onclick=freeScreen;
  $("#story-btn").onclick=storyIntro;
  $("#map-btn").onclick=mapScreen;
  $("#nb-btn").onclick=()=>openNotebook(home);
  $("#sw-btn").onclick=profileScreen;
}

/* ---------------- 탐정 수첩 ---------------- */
function openNotebook(back){
  renderTop();
  const S=P.story, L=P.lv;
  const clues=S.clues.length?S.clues.map(c=>`<div class="clue-card">🃏 ${escapeHTML(c)}</div>`).join(""):"<p>아직 모은 단서가 없어.</p>";
  const recs=LEVELS.map((x,i)=>{ const l=i+1, st=L.stars[l];
    return `<div class="rec"><span>레벨 ${l} (${x.n}×${x.n})</span><span>${st?"★".repeat(st)+"☆".repeat(3-st):(isOpen(l)?"🔎 도전 가능":"🔒")}</span></div>`; }).join("");
  screen.innerHTML=`<h2 class="center">📓 ${escapeHTML(cur)} 탐정의 수첩</h2>
    <div class="clue-card"><b>📏 스도쿠 규칙</b><br>
      1. 같은 가로줄에 같은 숫자는 한 번만!<br>2. 같은 세로줄에 같은 숫자는 한 번만!<br>
      3. 네모방 안에도 같은 숫자는 한 번만!<br>
      <small>4×4는 1~4, 6×6은 1~6, 9×9는 1~9를 써요.</small></div>
    <div class="clue-card"><b>💡 탐정 요령</b><br>
      • 빈칸이 하나 남은 줄이나 네모방부터!<br>
      • 칸을 누르면 같은 줄·네모방이 파랗게, 같은 숫자는 진하게 보여요.<br>
      • 숫자 버튼이 흐려지면 그 숫자는 다 찾은 거예요.<br>
      • 헷갈리면 ✏️ 메모로 후보 숫자를 적어 두세요.</div>
    <div class="clue-card golden"><b>🔐 황금 단서</b> : ${S.gold.map(g=>g??"?").join(" - ")}</div>
    <h3>🏅 레벨 기록</h3><div class="clue-card">${recs}</div>
    <h3>🎲 프리스타일 기록</h3><div class="clue-card">${[4,6,9].map(k=>`<div class="rec"><span>${k}×${k}</span><span>${DIFFS.map(([d,l])=>l.split(" ")[0]+(P.free.done[k+"-"+d]||0)).join(" ")}</span></div>`).join("")}</div>
    <h3>🃏 모은 단서 카드</h3>${clues}
    <div class="center"><button class="big-btn" id="nb-back">수첩 닫기</button></div>`;
  $("#nb-back").onclick=back;
}
</script>

<script>
"use strict";
/* =================== 사건 이야기 (규칙 배우기) =================== */
let storyCleared=false;
function storyStrip(){
  const S=P.story;
  return `<div class="story-strip"><div class="gold-strip" aria-label="황금 단서">${S.gold.map(g=>`<div class="gold-slot${g!=null?" filled":""}">${g??"?"}</div>`).join("")}</div>
    <div class="sprog">${Array.from({length:10},(_,i)=>`<div class="seg${i<S.mission?" done":""}"></div>`).join("")}</div></div>`;
}
function storyToolbar(){ return `<div class="toolbar"><button id="hint-btn">🔍 힌트</button><button id="notebook-btn">📓 수첩</button></div>`; }
function bindStoryToolbar(m){
  $("#hint-btn").onclick=()=>{ if(!storyCleared) fb("hint","🔍 "+m.hint); };
  $("#notebook-btn").onclick=()=>openNotebook(storyIntro);
}
function storyIntro(){
  G=null; renderTop();
  const S=P.story;
  if(S.finished||S.mission>=MISSIONS.length) return storyEnding();
  const m=MISSIONS[S.mission];
  screen.innerHTML=`<h2 class="center">📜 ${m.ch} - ${m.concept}</h2>${storyStrip()}
    ${chiefSays(escapeHTML(cur)+" 탐정! "+m.chief)}
    <div class="center"><button class="big-btn" id="go-btn">미션 시작!</button></div>
    <div class="toolbar"><button id="nb2">📓 수첩</button></div>`;
  $("#go-btn").onclick=()=>runMission(m);
  $("#nb2").onclick=()=>openNotebook(storyIntro);
}
function runMission(m){
  storyCleared=false; renderTop();
  ({quiz:quizMission, fill:fillMission, findwrong:findWrongMission, code:codeMission})[m.type](m);
}
function quizMission(m){
  screen.innerHTML=`<h2 class="center">${m.ch} O/X 퀴즈</h2>${storyStrip()}${chiefSays(m.chief)}
    <div class="bubble" style="font-size:1.15rem;margin:12px 0">❓ ${m.q}</div>
    <button class="choice" data-i="0">🙆 ${m.choices[0]}</button>
    <button class="choice" data-i="1">🙅 ${m.choices[1]}</button>
    <div id="feedback" class="feedback"></div><div class="center" id="next-slot"></div>${storyToolbar()}`;
  bindStoryToolbar(m);
  screen.querySelectorAll(".choice").forEach(btn=>btn.onclick=()=>{
    if(storyCleared) return;
    if(+btn.dataset.i===m.answer){ fb("ok","🎉 "+m.ok); missionClear(m); } else fb("no","🤔 "+m.no);
  });
}
function missingNum(grid){ const s=new Set(grid.flat()); for(let n=1;n<=4;n++) if(!s.has(n)) return n; return null; }
function fillMission(m){
  const grid=m.board.map(r=>r.slice()), solved={};
  screen.innerHTML=`<h2 class="center">${m.ch} ${m.concept}</h2>${storyStrip()}${chiefSays(m.chief)}
    <p class="center jua">빈칸을 누르고 숫자를 골라 봐!</p><div id="board-slot"></div>
    <div class="numpad">${[1,2,3,4].map(n=>`<button data-n="${n}">${n}</button>`).join("")}</div>
    <div id="feedback" class="feedback"></div><div class="center" id="next-slot"></div>${storyToolbar()}`;
  bindStoryToolbar(m);
  const board=buildBoard(grid,{bw:2,bh:2,marks:m.goldenCell?[[m.goldenCell[0],m.goldenCell[1],"★"]]:null});
  $("#board-slot").appendChild(board);
  const isTarget=(r,c)=>m.targets.some(t=>t[0]===r&&t[1]===c);
  let sel=null;
  const select=(c,r,cc)=>{ board.querySelectorAll(".cell").forEach(x=>x.classList.remove("selected")); c.classList.add("selected"); sel=[r,cc]; };
  board.querySelectorAll(".cell").forEach(c=>{
    const r=+c.dataset.r, cc=+c.dataset.c;
    if(!isTarget(r,cc)){ c.classList.add("given"); c.style.cursor="default"; return; }
    onTap(c,()=>{ if(storyCleared||solved[r+","+cc]) return; select(c,r,cc); });
  });
  // 첫 빈칸 자동 선택
  const t0=m.targets[0]; select(cellAt(board,t0[0],t0[1]),t0[0],t0[1]);
  screen.querySelectorAll(".numpad button").forEach(btn=>btn.onclick=()=>{
    if(storyCleared) return;
    if(!sel){ fb("hint","먼저 빈칸을 눌러 줘!"); return; }
    const [r,cc]=sel, n=+btn.dataset.n, cell=cellAt(board,r,cc);
    const ans=m.solution?m.solution[r][cc]:missingNum(grid);
    if(n===ans){
      grid[r][cc]=n; setCellNum(cell,n); cell.classList.remove("selected"); cell.classList.add("correct","pop");
      solved[r+","+cc]=true; sel=null;
      const left=m.targets.filter(t=>!solved[t[0]+","+t[1]]);
      if(left.length===0){ fb("ok","🎉 "+m.ok); missionClear(m); }

    } else {

  });
}

    </div>

      <button class="ghost" id="restart-story">🔁 이야기 처음부터</button></div>`;

<script>
"use strict";
/* =================== 문제 만들기 =================== */
function shuffled(a){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function okPlace(g,n,bw,bh,r,c,v){
  for(let i=0;i<n;i++) if(g[r][i]===v||g[i][c]===v) return false;
  const br=Math.floor(r/bh)*bh, bc=Math.floor(c/bw)*bw;
  for(let i=br;i<br+bh;i++) for(let j=bc;j<bc+bw;j++) if(g[i][j]===v) return false;
  return true;
}
function genSolution(n,bw,bh){
  const g=Array.from({length:n},()=>Array(n).fill(0));
  (function fill(pos){
    if(pos===n*n) return true;
    const r=Math.floor(pos/n), c=pos%n;
    for(const v of shuffled(Array.from({length:n},(_,i)=>i+1))){
      if(okPlace(g,n,bw,bh,r,c,v)){ g[r][c]=v; if(fill(pos+1)) return true; g[r][c]=0; }
    }
    return false;
  })(0);
  return g;
}
function makeUnits(n,bw,bh){
  const U=[];
  for(let r=0;r<n;r++) U.push({name:`${r+1}번째 가로줄`, cells:Array.from({length:n},(_,c)=>[r,c])});
  for(let c=0;c<n;c++) U.push({name:`${c+1}번째 세로줄`, cells:Array.from({length:n},(_,r)=>[r,c])});
  for(let br=0;br<n;br+=bh) for(let bc=0;bc<n;bc+=bw){
    const cells=[]; for(let i=br;i<br+bh;i++) for(let j=bc;j<bc+bw;j++) cells.push([i,j]);
    U.push({name:"반짝이는 칸이 있는 네모방", cells});
  }
  return U;
}
function candGrid(g,n,bw,bh){
  return g.map((row,r)=>row.map((v,c)=>{
    if(v) return null;
    const out=[]; for(let x=1;x<=n;x++) if(okPlace(g,n,bw,bh,r,c,x)) out.push(x); return out;
  }));
}
/* 아이가 '추리'로 풀 수 있는 다음 한 수: 후보가 하나뿐인 칸 → 줄/네모방에서 갈 곳이 하나뿐인 숫자 */
function stepSingle(g,n,bw,bh,units){
  const C=candGrid(g,n,bw,bh);
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(C[r][c]&&C[r][c].length===1) return {r,c,v:C[r][c][0],type:"naked"};
  for(const u of units){
    for(let v=1;v<=n;v++){
      if(u.cells.some(([r,c])=>g[r][c]===v)) continue;
      const spots=u.cells.filter(([r,c])=>C[r][c]&&C[r][c].includes(v));
      if(spots.length===1) return {r:spots[0][0],c:spots[0][1],v,type:"hidden",unit:u.name};
    }
  }
  return null;
}
function solvableBySingles(g0,n,bw,bh,units){
  const g=g0.map(r=>r.slice());
  for(;;){ const s=stepSingle(g,n,bw,bh,units); if(!s) break; g[s.r][s.c]=s.v; }
  return g.every(row=>row.every(v=>v));
}
/* 찍지 않고 추리만으로 풀리는 문제만 만든다 (답도 하나뿐) */
function genPuzzle(n,bw,bh,blanks){
  const units=makeUnits(n,bw,bh), solution=genSolution(n,bw,bh), puzzle=solution.map(r=>r.slice());
  let removed=0;
  for(const pos of shuffled(Array.from({length:n*n},(_,i)=>i))){
    if(removed>=blanks) break;
    const r=Math.floor(pos/n), c=pos%n, bak=puzzle[r][c];
    puzzle[r][c]=0;
    if(solvableBySingles(puzzle,n,bw,bh,units)) removed++; else puzzle[r][c]=bak;
  }
  return {puzzle,solution};
}

/* =================== 레벨 지도 =================== */
let G=null; // 지금 진행 중인 판의 화면 상태
function mapScreen(){
  G=null; renderTop();
  const L=P.lv, nx=nextLevel();
  let html=`<h2 class="center">🗺️ 레벨 지도</h2>
    ${chiefSays("한 사건씩 해결하면 판이 점점 커져! 목표는 9×9 명탐정!")}`;
  for(const [a,b,title,sub] of ZONES){
    html+=`<div class="zone"><h3>${title} <small>${sub}</small></h3><div class="lv-grid">`;
    for(let l=a;l<=b;l++){
      const done=L.cleared.includes(l), open=isOpen(l), st=L.stars[l]||0, res=L.current&&L.current.lv===l;
      const inner=`${res?'<span class="resume">이어하기</span>':""}<span style="font-size:1.3rem">${done?"📂":open?"🔎":"🔒"}</span>레벨 ${l}<span class="stars">${st?"★".repeat(st)+"☆".repeat(3-st):""}</span>`;
      html+=open
        ? `<button class="lv-card ${done?"done":"open"}${l===nx&&!done?" next":""}" data-lv="${l}">${inner}</button>`
        : `<div class="lv-card locked" role="img" aria-label="레벨 ${l} 잠김">${inner}</div>`;
    }
    html+=`</div></div>`;
  }
  html+=`<div class="toolbar"><button id="m-home">🏠 처음 화면</button><button id="m-nb">📓 수첩</button></div>`;
  screen.innerHTML=html;
  screen.querySelectorAll("button.lv-card").forEach(b=>b.onclick=()=>levelIntro(+b.dataset.lv));
  $("#m-home").onclick=home;
  $("#m-nb").onclick=()=>openNotebook(mapScreen);
}
function levelIntro(lv){
  G=null; renderTop();
  const L=LEVELS[lv-1], res=P.lv.current&&P.lv.current.lv===lv;
  let msg;
  if(lv===5) msg="판이 커졌어! 이제 6×6이야. 네모방은 가로 3칸, 세로 2칸짜리 직사각형! 숫자는 1부터 6까지!";
  else if(lv===9) msg="드디어 9×9 진짜 스도쿠야! 숫자는 1부터 9까지, 네모방은 3×3! 헷갈리면 ✏️ 메모를 써 봐!";
  else if(lv===13) msg="전설 사건이야! 빈칸이 엄청 많아. 빈칸이 적은 줄부터 차근차근 찾아봐!";
  else msg=`레벨 ${lv} 사건! ${L.n}×${L.n} 판에서 빈칸 약 ${L.blanks}개를 채워 줘! 숫자는 1부터 ${L.n}까지야!`;
  screen.innerHTML=`<h2 class="center">레벨 ${lv} ${zoneIcon(lv)}</h2>${chiefSays(msg)}
    <div class="center">${res
      ?`<button class="big-btn" id="res-btn">▶ 이어하기</button><br><br><button id="new-btn">🔄 새 판으로 시작</button>`
      :`<button class="big-btn" id="go-btn">사건 시작!</button>`}</div>
    <div class="toolbar"><button id="li-map">🗺️ 지도로</button></div>`;
  if(res){ $("#res-btn").onclick=()=>playScreen("lv"); $("#new-btn").onclick=()=>newGame(lv); }
  else $("#go-btn").onclick=()=>newGame(lv);
  $("#li-map").onclick=mapScreen;
}
function newGame(lv){
  G=null;
  screen.innerHTML=`<div class="loading-box"><span class="mag">🕵️</span><p class="jua" style="font-size:1.2rem;margin-top:12px">사건 파일을 만드는 중…</p></div>`;
  setTimeout(()=>{
    const L=LEVELS[lv-1], {puzzle,solution}=genPuzzle(L.n,L.bw,L.bh,L.blanks);
    P.lv.current={lv, n:L.n, bw:L.bw, bh:L.bh, puzzle, solution, grid:puzzle.map(r=>r.slice()),
      notes:puzzle.map(r=>r.map(()=>[])), hints:0, mistakes:0};
    persist(); playScreen("lv");
  },60);
}

/* =================== 프리스타일 =================== */
function freeScreen(){
  G=null; renderTop();
  const F=P.free, c=F.current;
  let selN=(F.last&&F.last.n)||4, selD=(F.last&&F.last.diff)||"easy";
  screen.innerHTML=`<h2 class="center">🎲 프리스타일</h2>
    ${chiefSays("판 크기와 난이도를 마음대로 골라 봐! 몇 판이든 계속 풀 수 있어.")}
    ${c?`<button class="menu-btn hl" id="fr-res"><span class="ic">▶️</span><span><b class="jua">하던 판 이어하기</b><small>${c.n}×${c.n} · ${diffName(c.diff)}</small></span></button>`:""}
    <h3>📐 판 크기</h3>
    <div class="opt-row" id="opt-n">${[4,6,9].map(k=>`<button class="opt" data-n="${k}">${k}×${k}<small>숫자 1~${k}</small></button>`).join("")}</div>
    <h3>🎚️ 난이도</h3>
    <div class="opt-row" id="opt-d">${DIFFS.map(([k,l])=>`<button class="opt" data-d="${k}">${l}<small id="bl-${k}"></small></button>`).join("")}</div>
    <div class="center" style="margin-top:14px"><button class="big-btn" id="fr-go">🎲 시작!</button></div>
    <div class="clue-card" id="fr-rec"></div>
    <div class="toolbar"><button id="fr-home">🏠 처음 화면</button></div>`;
  function refresh(){
    screen.querySelectorAll("#opt-n .opt").forEach(b=>b.classList.toggle("on",+b.dataset.n===selN));
    screen.querySelectorAll("#opt-d .opt").forEach(b=>b.classList.toggle("on",b.dataset.d===selD));
    DIFFS.forEach(([k])=>{ $("#bl-"+k).textContent=`빈칸 약 ${FREE_BLANKS[selN][k]}개`; });
    $("#fr-rec").innerHTML=`<b>📊 ${selN}×${selN} 해결 기록</b><br>`+DIFFS.map(([k,l])=>`${l} ${F.done[selN+"-"+k]||0}판`).join(" · ");
  }
  screen.querySelectorAll("#opt-n .opt").forEach(b=>b.onclick=()=>{ selN=+b.dataset.n; refresh(); });
  screen.querySelectorAll("#opt-d .opt").forEach(b=>b.onclick=()=>{ selD=b.dataset.d; refresh(); });
  if(c) $("#fr-res").onclick=()=>playScreen("free");
  $("#fr-go").onclick=()=>{
    if(c&&!confirm("하던 판은 사라져요. 새 판을 시작할까?")) return;
    F.last={n:selN,diff:selD}; persist(); newFree(selN,selD);
  };
  $("#fr-home").onclick=home;
  refresh();
}
function newFree(n,diff){
  G=null;
  screen.innerHTML=`<div class="loading-box"><span class="mag">🎲</span><p class="jua" style="font-size:1.2rem;margin-top:12px">문제를 만드는 중…</p></div>`;
  setTimeout(()=>{
    const S=SIZES[n], {puzzle,solution}=genPuzzle(n,S.bw,S.bh,FREE_BLANKS[n][diff]);
    P.free.current={mode:"free", n, bw:S.bw, bh:S.bh, diff, puzzle, solution, grid:puzzle.map(r=>r.slice()),
      notes:puzzle.map(r=>r.map(()=>[])), hints:0, mistakes:0};
    persist(); playScreen("free");
  },60);
}

/* =================== 레벨 플레이 =================== */
function playScreen(mode){
  renderTop();
  const isFree=mode==="free";
  const g=isFree?P.free.current:P.lv.current; if(!g) return isFree?freeScreen():mapScreen();
  const L=g.n?g:LEVELS[g.lv-1], n=L.n, bw=L.bw, bh=L.bh, units=makeUnits(n,bw,bh);
  const title=isFree?`🎲 프리스타일 <small>${n}×${n} · ${diffName(g.diff)}</small>`:`레벨 ${g.lv} ${zoneIcon(g.lv)} <small>${n}×${n}</small>`;
  screen.innerHTML=`<div class="play-head"><h2>${title}</h2><span id="stat" class="stat"></span></div>
    <div id="board-slot"></div>
    <div id="numpad" class="numpad n${n}">${Array.from({length:n},(_,i)=>`<button data-n="${i+1}">${i+1}</button>`).join("")}</div>
    <div class="toolbar"><button id="note-btn">✏️ 메모</button><button id="erase-btn">🧽 메모 지우기</button><button id="hint-btn">🔍 힌트</button></div>
    <div id="feedback" class="feedback"></div>
    <div id="next-slot" class="center"></div>
    <div class="toolbar" id="play-foot"><button id="p-map">${isFree?"⚙️ 설정":"🗺️ 지도"}</button><button id="p-new">🔄 새 판</button></div>`;
  const board=buildBoard(g.grid,{bw,bh});
  $("#board-slot").appendChild(board);
  const cells=[...board.querySelectorAll(".cell")];
  const el=(r,c)=>cells[r*n+c];
  const sameBox=(r1,c1,r2,c2)=>Math.floor(r1/bh)===Math.floor(r2/bh)&&Math.floor(c1/bw)===Math.floor(c2/bw);
  const related=(r1,c1,r2,c2)=>r1===r2||c1===c2||sameBox(r1,c1,r2,c2);
  G={done:false, sel:null, noteMode:false, hint:null, hintStage:0, lock:false};

  const notesHTML=arr=>`<div class="notes" style="grid-template-columns:repeat(${n===4?2:3},1fr)">${
    Array.from({length:n},(_,i)=>`<span>${arr.includes(i+1)?i+1:""}</span>`).join("")}</div>`;
  function paint(){
    const s=G.sel, sv=s?g.grid[s[0]][s[1]]:0;
    cells.forEach(d=>{
      const r=+d.dataset.r, c=+d.dataset.c, v=g.grid[r][c], isSel=!!s&&s[0]===r&&s[1]===c;
      d.classList.toggle("given",!!g.puzzle[r][c]);
      if(v) d.textContent=v; else if(g.notes[r][c].length) d.innerHTML=notesHTML(g.notes[r][c]); else d.textContent="";
      d.classList.toggle("selected",isSel);
      d.classList.toggle("related",!!s&&!isSel&&related(s[0],s[1],r,c));
      d.classList.toggle("same-num",!!sv&&!isSel&&v===sv);
    });
    const cnt=Array(n+1).fill(0); g.grid.forEach(row=>row.forEach(v=>{ if(v) cnt[v]++; }));
    screen.querySelectorAll("#numpad button").forEach(b=>b.classList.toggle("full",cnt[+b.dataset.n]>=n));
    $("#numpad").classList.toggle("note-on",G.noteMode);
    const nb=$("#note-btn"); nb.classList.toggle("on",G.noteMode); nb.textContent=G.noteMode?"✏️ 메모 켜짐":"✏️ 메모";
    $("#stat").textContent=`남은 칸 ${g.grid.flat().filter(v=>!v).length} · 실수 ${g.mistakes} · 힌트 ${g.hints}`;
  }
  function flash(d){ d.classList.remove("hintflash"); void d.offsetWidth; d.classList.add("hintflash"); }
  function conflictWhy(r,c,v){
    for(let i=0;i<n;i++) if(i!==c&&g.grid[r][i]===v) return `이 가로줄에 벌써 ${v}이(가) 있어!`;
    for(let i=0;i<n;i++) if(i!==r&&g.grid[i][c]===v) return `이 세로줄에 벌써 ${v}이(가) 있어!`;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++) if((i!==r||j!==c)&&sameBox(i,j,r,c)&&g.grid[i][j]===v) return `이 네모방에 벌써 ${v}이(가) 있어!`;
    return "겹치는 숫자는 없지만 이 칸의 답은 아니야. 빈칸이 적은 줄부터 풀어 볼까?";
  }
  function select(r,c){ if(G.done) return; G.sel=[r,c]; paint(); }
  cells.forEach(d=>onTap(d,()=>select(+d.dataset.r,+d.dataset.c)));

  function input(v){
    if(G.done) return;
    if(!G.sel){ fb("hint","먼저 빈칸을 눌러 줘!"); return; }
    const [r,c]=G.sel, d=el(r,c);
    if(g.puzzle[r][c]){ fb("hint","그 칸은 처음부터 있던 단서야! 빈칸을 골라 봐!"); return; }
    if(g.grid[r][c]){ fb("hint","이미 해결한 칸이야! 다른 빈칸을 골라 봐!"); return; }
    if(G.noteMode){
      const a=g.notes[r][c], i=a.indexOf(v);
      if(i>=0) a.splice(i,1); else { a.push(v); a.sort((x,y)=>x-y); }
      persist(); paint(); return;
    }
    if(v===g.solution[r][c]){
      g.grid[r][c]=v; g.notes[r][c]=[];
      for(let i=0;i<n;i++) for(let j=0;j<n;j++) if(related(r,c,i,j)){ const a=g.notes[i][j], k=a.indexOf(v); if(k>=0) a.splice(k,1); }
      if(G.hint&&G.hint.r===r&&G.hint.c===c){ G.hint=null; G.hintStage=0; }
      persist(); paint(); d.classList.remove("pop"); void d.offsetWidth; d.classList.add("pop");
      if(g.grid.every(row=>row.every(x=>x))) return levelClear();
      const filled=g.grid.flat().filter(x=>x===v).length;
      fb("ok", filled>=n?`🎉 숫자 ${v}을(를) 전부 찾았어!`:"👍 맞았어! 계속 조사해 보자!");
    } else {
      if(G.lock) return; G.lock=true;
      g.mistakes++; persist(); paint();
      d.classList.add("wrong"); setTimeout(()=>{ d.classList.remove("wrong"); G&&(G.lock=false); },600);
      fb("no","🤔 "+conflictWhy(r,c,v));
    }
  }
  function erase(){
    if(G.done||!G.sel) return;
    const [r,c]=G.sel; if(g.grid[r][c]) return;
    g.notes[r][c]=[]; persist(); paint();
  }
  function toggleNote(){ if(G.done) return; G.noteMode=!G.noteMode; paint();
    if(G.noteMode) fb("hint","✏️ 메모 모드! 숫자를 누르면 칸에 작게 적혀. 한 번 더 누르면 지워져."); }
  function hint(){
    if(G.done) return;
    if(!G.hint||g.grid[G.hint.r][G.hint.c]){
      G.hint=stepSingle(g.grid,n,bw,bh,units); G.hintStage=0;
      if(!G.hint){ for(let r=0;r<n&&!G.hint;r++) for(let c=0;c<n;c++) if(!g.grid[r][c]){ G.hint={r,c,v:g.solution[r][c],type:"reveal"}; break; } }
    }
    const h=G.hint; if(!h) return;
    G.hintStage++; g.hints++; persist();
    G.sel=[h.r,h.c]; paint(); flash(el(h.r,h.c));
    if(G.hintStage===1&&h.type==="naked") fb("hint","🔍 반짝이는 칸을 봐! 가로줄·세로줄·네모방에 없는 숫자는 딱 하나뿐이야. 뭘까?");
    else if(G.hintStage===1&&h.type==="hidden") fb("hint",`🔍 「${h.unit}」에서 숫자 ${h.v}이(가) 갈 수 있는 곳은 반짝이는 칸뿐이야!`);
    else fb("hint",`🔍 반짝이는 칸의 정답은 「${h.v}」! 숫자 버튼을 눌러 채워 봐!`);
  }
  screen.querySelectorAll("#numpad button").forEach(b=>b.onclick=()=>input(+b.dataset.n));
  $("#note-btn").onclick=toggleNote;
  $("#erase-btn").onclick=erase;
  $("#hint-btn").onclick=hint;
  $("#p-map").onclick=isFree?freeScreen:mapScreen;
  $("#p-new").onclick=()=>{ if(confirm("지금 판을 버리고 새 판을 만들까?")){ if(isFree) newFree(n,g.diff); else newGame(g.lv); } };

  function freeClear(){
    G.done=true;
    const penalty=g.hints+Math.floor(g.mistakes/3), stars=penalty===0?3:penalty<=2?2:1;
    const key=n+"-"+g.diff, diff=g.diff, hints=g.hints, mistakes=g.mistakes;
    P.free.done[key]=(P.free.done[key]||0)+1;
    P.free.current=null; persist(); renderTop();
    G.sel=null; cells.forEach(d=>d.classList.remove("selected","related","same-num"));
    $("#play-foot").style.display="none";
    fb("ok","🎉 해결! 정말 대단해!");
    $("#next-slot").innerHTML=`<span class="stamp">해결!</span>
      <p class="jua" style="font-size:2rem;color:#e8a13c;margin:8px">${"★".repeat(stars)}${"☆".repeat(3-stars)}</p>
      <p>힌트 ${hints}번 · 실수 ${mistakes}번</p>
      <p class="jua">${n}×${n} ${diffName(diff)} ${P.free.done[key]}번째 해결!</p><br>
      <button class="big-btn" id="f-again">🎲 한 판 더!</button>
      <button id="f-set" style="margin-left:6px">⚙️ 설정 바꾸기</button>`;
    $("#f-again").onclick=()=>newFree(n,diff);
    $("#f-set").onclick=freeScreen;
    try{ $("#f-again").scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
  }
  function levelClear(){
    if(isFree) return freeClear();
    G.done=true;
    const lv=g.lv, penalty=g.hints+Math.floor(g.mistakes/3), stars=penalty===0?3:penalty<=2?2:1;
    const before=rankOf(P.lv.cleared.length);
    if(!P.lv.cleared.includes(lv)) P.lv.cleared.push(lv);
    if((P.lv.stars[lv]||0)<stars) P.lv.stars[lv]=stars;
    const hints=g.hints, mistakes=g.mistakes;
    P.lv.current=null; persist(); renderTop();
    const after=rankOf(P.lv.cleared.length);
    G.sel=null; cells.forEach(d=>d.classList.remove("selected","related","same-num"));
    $("#play-foot").style.display="none";
    fb("ok","🎉 사건 해결! 대단해!");
    const next=()=>{ if(lv>=LEVELS.length) legendEnding(); else levelIntro(lv+1); };
    $("#next-slot").innerHTML=`<span class="stamp">사건 해결!</span>
      <p class="jua" style="font-size:2rem;color:#e8a13c;margin:8px">${"★".repeat(stars)}${"☆".repeat(3-stars)}</p>
      <p>힌트 ${hints}번 · 실수 ${mistakes}번</p><br>
      <button class="big-btn" id="t-next">${lv>=LEVELS.length?"👑 전설의 임명장 받기!":"다음 사건!"}</button>
      <button id="t-map" style="margin-left:6px">🗺️ 지도</button>`;
    $("#t-map").onclick=mapScreen;
    $("#t-next").onclick=()=>{ if(after[2]!==before[2]&&lv<LEVELS.length) rankUp(after,next); else next(); };
    try{ $("#t-next").scrollIntoView({behavior:"smooth",block:"center"}); }catch(e){}
  }
  G.input=input; G.erase=erase; G.toggleNote=toggleNote; G.select=select; G.n=n;
  paint();
}
document.addEventListener("keydown",e=>{
  if(!G||G.done||!G.input||!$("#numpad")) return;
  if(/^[1-9]$/.test(e.key)&&+e.key<=G.n){ e.preventDefault(); G.input(+e.key); }
  else if(e.key==="Backspace"||e.key==="Delete"){ e.preventDefault(); G.erase(); }
  else if(e.key==="n"||e.key==="N"){ G.toggleNote(); }
  else if(e.key.startsWith("Arrow")){
    e.preventDefault();
    const [r,c]=G.sel||[0,0], n=G.n;
    const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    G.select((r+d[0]+n)%n,(c+d[1]+n)%n);
  }
});

function rankUp(rk,then){
  renderTop();
  const msgs={"견습 탐정":"이제 혼자서도 조사를 시작할 수 있겠어!","꼬마 탐정":"4×4 동네 사건을 모두 해결했어! 다음은 6×6 도시야!",
    "도시 탐정":"6×6도 거뜬하네! 이제 진짜 9×9 스도쿠에 도전할 차례야!","명탐정":"9×9 사건까지 해결하다니! 진짜 명탐정이야!"};
  screen.innerHTML=`<div class="center"><h2>🎊 탐정 승급! 🎊</h2>
    <div class="pop" style="font-size:5rem;margin:16px">${rk[1]}</div>
    <p class="jua" style="font-size:1.5rem">${escapeHTML(cur)} 탐정은 이제<br>「${rk[2]}」!</p>
    ${chiefSays(msgs[rk[2]]||"정말 대단해!")}
    <button class="big-btn" id="rk-btn">계속하기</button></div>`;
  $("#rk-btn").onclick=then;
}
function legendEnding(){
  renderTop();
  const d=new Date(), dateStr=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`, nm=escapeHTML(cur);
  screen.innerHTML=`<h2 class="center">👑 전설의 탐정 탄생! 👑</h2>
    ${chiefSays(nm+" 탐정! 4×4부터 9×9까지 15개의 사건을 모두 해결하다니… 정말 전설이야!")}
    <div class="center"><span class="stamp">전설 인정!</span></div>
    <div class="cert pop">
      <p class="jua" style="font-size:1.5rem">👑 전설의 탐정 임명장 👑</p><br>
      <p><b>${nm} 탐정</b>은</p><p>15개의 스도쿠 사건을 모두 해결하여</p>
      <p><b>전설의 탐정</b>으로 임명합니다!</p><br>
      <p>${dateStr}</p><p>탐정 사무소 대장 탐정 🕵️</p>
    </div>
    <div class="center pop" style="font-size:4rem">👑</div>
    <div class="center"><button class="big-btn" id="lg-map">🗺️ 지도로 (별 3개 도전!)</button></div>`;
  $("#lg-map").onclick=mapScreen;
}

/* =================== 부모님 안내 =================== */
function renderParent(){
  $("#parent-content").innerHTML=`
    <p>📈 <b>레벨 구성</b> — 1~4: 4×4 · 5~8: 6×6 · 9~15: 9×9. 앞 레벨을 풀어야 다음 레벨이 열려요.</p>
    <p>🧩 문제는 매번 새로 만들어지며, <b>찍지 않고 추리만으로 풀리는 문제</b>(답이 하나뿐)만 나와요. 틀린 숫자는 칸에 들어가지 않고 이유를 알려줘요.</p>
    <p>🎲 <b>프리스타일</b> — 판 크기(4×4·6×6·9×9)와 난이도(쉬움·보통·어려움·최고)를 골라 무제한으로 풀어요. 레벨 진행과는 따로 기록돼요.</p>
    <p>⭐ <b>별 기준</b> — 힌트 1번 또는 실수 3번마다 1점. 0점 ★★★, 1~2점 ★★, 3점 이상 ★</p>
    <p>💾 진행 상황은 이 기기 브라우저에 탐정(아이)별로 저장돼요.</p>
    <p><b>🔐 사건 이야기 비밀번호: ${PASSWORD}</b> (황금 단서 3-1-4-2)</p>
    <table><tr><th>이야기</th><th>정답</th></tr>
    <tr><td>1</td><td>안 돼! 한 번만!</td></tr><tr><td>2</td><td>3</td></tr><tr><td>3</td><td>2</td></tr><tr><td>4</td><td>1</td></tr>
    <tr><td>5</td><td>세 번째 줄 두 번째 칸 (2 → 원래 1)</td></tr><tr><td>6</td><td>★ 칸 4, 옆 칸 1</td></tr>
    <tr><td>7</td><td>1행 3칸=3, 2행 1칸=3, 4행 3칸=2</td></tr><tr><td>8</td><td>42</td></tr>
    <tr><td>9</td><td>2143 / 3412 / 1234 / 4321</td></tr><tr><td>10</td><td>1342 / 4213 / 2431 / 3124</td></tr></table>
    ${cur?`<div class="toolbar"><button id="rs-story">📜 이야기 초기화</button><button id="rs-lv">🗺️ 레벨 기록 초기화</button></div>`:""}`;
  if(cur){
    $("#rs-story").onclick=()=>{ if(confirm(cur+" 탐정의 사건 이야기 진행을 처음으로 돌릴까요?")){ P.story=freshProfile().story; profiles[cur]=P; persist(); home(); } };
    $("#rs-lv").onclick=()=>{ if(confirm(cur+" 탐정의 레벨 기록(별, 해결 기록)을 모두 지울까요?")){ P.lv=freshProfile().lv; profiles[cur]=P; persist(); home(); } };
  }
}

/* =================== 시작 =================== */
load();
if(cur&&profiles[cur]){ useProfile(cur); home(); } else profileScreen();

/* 홈 화면 앱(PWA) - 실패해도 게임은 정상 작동 */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
